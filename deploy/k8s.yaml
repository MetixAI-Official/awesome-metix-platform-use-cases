# The Casebook origin: one Deployment and a ClusterIP Service named `casebook`,
# in the same namespace as the platform's web app, which reaches it at
# http://casebook:80 (CASEBOOK_ORIGIN). Nothing here is exposed outside the
# cluster; there is deliberately no Ingress.
#
# Replace NAMESPACE and the image tag. The pods are stateless and small: the
# whole site is a few megabytes of static files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casebook
  namespace: NAMESPACE
  labels:
    app: casebook
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: casebook
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: casebook
    spec:
      containers:
        - name: casebook
          image: harbor.openjobs-ai.com/openjobs-ai/casebook:TAG
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: casebook
  namespace: NAMESPACE
  labels:
    app: casebook
spec:
  type: ClusterIP
  selector:
    app: casebook
  ports:
    - name: http
      port: 80
      targetPort: http
