# The Casebook's origin. Nothing reaches this server from the internet: the
# platform's web app proxies platform.metix.ai/casebook here
# (CASEBOOK_ORIGIN=http://casebook:80) and adds the security headers itself.
#
# The build is Astro with base /casebook, trailingSlash "never" and
# build.format "file", so /casebook/x is the file x.html and /casebook/zh is
# zh.html. Addresses have no trailing slash: the platform drops one with a 308
# before it proxies, and a slashed request that still arrives is redirected the
# same way, never answered, so the two can never loop.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Relative Location headers: this server does not know the public host.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^(?<unslashed>/casebook(?:/.*)?)/+$ {
        return 308 $unslashed$is_args$args;
    }

    location = /casebook {
        add_header Cache-Control "no-cache" always;
        try_files /casebook/index.html =404;
    }

    # Hashed build assets never change under the same name. No `always`: a 404
    # for a missing asset must not be cached for a year.
    location /casebook/_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /casebook/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location / {
        return 404;
    }
}
