name: public-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check files against the public data policy
        env:
          # Empty on pull requests from forks, which then run the public rules only.
          PUBLIC_CHECK_DENYLIST: ${{ secrets.PUBLIC_CHECK_DENYLIST }}
        run: python scripts/check_public.py
      - name: Test the checker
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q scripts
