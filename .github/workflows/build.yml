name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The site is served at platform.metix.ai/casebook from the image in
      # Dockerfile (deploy/README.md). This job builds and checks it on every push.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the site
        working-directory: site
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      # The pages are served on the same origin as the platform's console; fail the
      # build before it ships anything that could reach the login (docs/style.md).
      - name: Check the built site
        run: node tools/check-dist.mjs site/dist
