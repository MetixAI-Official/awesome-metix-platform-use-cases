name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The site is served at platform.metix.ai/casebook from its own host (see
      # docs/framework.md). This job still builds it, to check it, and then publishes
      # only the redirect pages that keep the old github.io addresses working.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build the site
        working-directory: site
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      # The pages are served on the same origin as the platform's console; fail the
      # build before it ships anything that could reach the login (docs/style.md).
      - name: Check the built site
        run: node tools/check-dist.mjs site/dist
      - name: Build the github.io redirect pages
        run: node tools/build-redirects.mjs site/redirects
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/redirects
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
