# Copy this folder to cases/<slug>/ and fill in every field.
# Field rules are in docs/framework.md under "The case contract".
slug: replace-with-slug-2026
type: snapshot # study | snapshot | recipe | agent
format: card # card | report
status: draft # planned | draft | published
title:
  en: Working title until the data exists
  zh: 数据出来之前先写工作标题
dek:
  en: One sentence with the scope, the population, and the period.
  zh: 一句话写清范围、人群和时间。
datasets: [jobs] # any of people, jobs, companies
integration: [rest] # any of rest, mcp, skills
topics: []
regions: [US] # ISO country codes, or global
# snapshot: YYYY-MM-DD, the day the replay ran
# published: YYYY-MM-DD, set when status becomes published
# exploration_credits: Credits the agent spent before the replay
# agent_run: { low: L, high: H, cap: CAP }  what following PROMPT.md costs (counts plus the reads it asks for) and the ceiling it stops at; required to publish
